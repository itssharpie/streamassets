<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally — Gamepad Viewer link</title><style>body{background:#071326;color:#e8f2ff;font:16px/1.6 Arial,sans-serif;max-width:740px;padding:32px 22px;margin:auto}h1{font-style:italic}label{display:block;margin-top:22px}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border:1px solid #365d89;border-radius:8px;background:#0d2240;color:white}textarea{height:140px;resize:vertical}button{margin-top:12px;background:#0348b1;cursor:pointer}p{color:#a5bddc}#error{color:#ffa9af}</style></head><body><h1>SHARPIE / RALLY</h1><p>Paste your published Rally stylesheet URL to build the OBS controller link.</p><label for="css-url">Public HTTPS URL ending in /rally/rally.css</label><input id="css-url" type="url" placeholder="https://yourname.github.io/yourrepo/rally/rally.css"><p id="error" role="status"></p><label for="viewer-url">Gamepad Viewer URL</label><textarea id="viewer-url" readonly></textarea><button id="copy" disabled>Copy viewer URL</button><p>The hosted files must already be published. This builder works locally and sends nothing anywhere.</p><script>
const input=document.querySelector('#css-url'),output=document.querySelector('#viewer-url'),error=document.querySelector('#error'),copy=document.querySelector('#copy');
input.addEventListener('input',()=>{try{const url=new URL(input.value.trim());if(url.protocol!=='https:'||!url.pathname.endsWith('.css'))throw Error();const viewer=new URL('https://app.gpv.gg/');viewer.searchParams.set('p','1');viewer.searchParams.set('s','8');viewer.searchParams.set('editcss',url.href);output.value=viewer.href;error.textContent='';copy.disabled=false;}catch{output.value='';copy.disabled=true;error.textContent=input.value?'Enter a public HTTPS URL for the .css file.':'';}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);copy.textContent='Copied';}catch{output.select();error.textContent='Press Ctrl+C to copy the selected URL.';}});
</script></body></html>
